<title>Kadosh Royal Ecclesia — Membership Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pp-900:#26093f; --pp-800:#350f53; --pp-700:#4a1d6e; --pp-600:#5e2a87;
  --gold:#cda434; --gold-l:#ecc868; --gold-d:#a47d1f; --gold-soft:#f3e3b0;
  --crimson:#b5302a; --crimson-d:#8e231e;
  --ink:#2c2233; --ink-soft:#5f5366; --ink-faint:#928697;
  --bg:#f6f1ea; --bg-2:#efe7d8; --paper:#fffdfa; --line:#e7dcc9;
  --growing:#5f7355; --active:#2f8079; --worker:#cb9a2f; --covenant:#6b2c3e;
  --inactive:#9a8d86; --drifting:#c2683f; --unclassified:#b3a99e;
  --shadow:0 1px 2px rgba(50,20,60,.06),0 10px 34px rgba(50,20,60,.08);
  --radius:16px;
  --sb:264px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:
  radial-gradient(1100px 560px at 90% -8%, #fbf4e6 0%, transparent 58%),
  radial-gradient(900px 520px at -6% 108%, #f0e6d4 0%, transparent 52%),
  var(--bg);
  color:var(--ink);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;margin:0}
.serif{font-family:'Cormorant Garamond',serif}

/* ===== Layout ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sb);flex:none;position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,var(--pp-800),var(--pp-900) 70%);
  color:#efe6f5;display:flex;flex-direction:column;padding:22px 16px;
  box-shadow:6px 0 30px rgba(38,9,63,.18);z-index:20}
.sb-brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 6px 18px;border-bottom:1px solid rgba(236,200,104,.18)}
.sb-logo{width:96px;height:96px;border-radius:50%;background:#fff;padding:8px;object-fit:contain;
  box-shadow:0 8px 26px rgba(0,0,0,.35),0 0 0 2px var(--gold);margin-bottom:12px}
.sb-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;line-height:1.05;color:#fff;letter-spacing:.02em}
.sb-tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-l);margin-top:6px}
.sb-nav{display:flex;flex-direction:column;gap:3px;margin-top:18px;flex:1;overflow:auto}
.sb-sec{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,227,176,.55);
  padding:14px 14px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:12px;font-family:'Outfit';font-size:14px;font-weight:500;
  color:#d9cce4;background:transparent;border:none;border-radius:11px;padding:11px 14px;cursor:pointer;
  text-align:left;width:100%;transition:.16s;position:relative}
.navitem .ico{width:20px;text-align:center;font-size:15px;opacity:.85;flex:none}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.active{background:linear-gradient(100deg,rgba(205,164,52,.22),rgba(205,164,52,.06));color:#fff}
.navitem.active::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.navitem.active .ico{opacity:1;color:var(--gold-l)}
.sb-foot{font-size:11px;color:rgba(217,204,228,.5);text-align:center;padding-top:14px;border-top:1px solid rgba(236,200,104,.14)}
.saved{font-size:11px;color:var(--gold-l);display:flex;align-items:center;gap:6px;justify-content:center;opacity:0;transition:.3s;margin-top:8px}
.saved.show{opacity:1}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-l)}

.main{flex:1;min-width:0;padding:30px 38px 70px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.pagehead h1{font-size:32px;line-height:1}
.pagehead .crumb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);font-weight:600;margin-bottom:8px}
.section-intro{font-size:14px;color:var(--ink-soft);max-width:80ch;margin:6px 0 24px}

/* mobile */
.mtopbar{display:none}
@media(max-width:880px){
  .shell{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;flex-direction:column;padding:16px}
  .sb-brand{flex-direction:row;gap:14px;text-align:left;border-bottom:none;padding-bottom:8px}
  .sb-logo{width:60px;height:60px;margin:0}
  .sb-nav{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:12px}
  .sb-sec{display:none}.sb-foot{display:none}
  .navitem{width:auto;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.06)}
  .navitem.active::before{display:none}
  .main{padding:22px 18px 60px}
}

/* ===== Cards / panels ===== */
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fit,minmax(186px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat{position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.stat.s-green::after{background:var(--growing)} .stat.s-red::after{background:var(--drifting)}
.stat.s-purple::after{background:var(--pp-600)} .stat.s-teal::after{background:var(--active)}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:600}
.stat .v{font-family:'Fraunces',serif;font-size:36px;font-weight:600;line-height:1;margin-top:10px}
.stat .d{font-size:12.5px;color:var(--ink-soft);margin-top:7px}
.stat .ic{position:absolute;top:15px;right:16px;font-size:20px;opacity:.18}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.panel h3{font-size:20px;margin-bottom:3px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.muted{color:var(--ink-faint);font-size:13px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;color:#fff;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85)}
.b-Growing{background:var(--growing)} .b-Active{background:var(--active)} .b-Worker{background:var(--worker)}
.b-Covenant{background:var(--covenant)} .b-Inactive{background:var(--inactive)} .b-Drifting{background:var(--drifting)}
.b-Unclassified{background:var(--unclassified)}

/* Tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--bg-2);text-align:left;font-weight:600;color:var(--ink-soft);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.05em;padding:11px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap;z-index:2}
td{padding:11px 14px;border-bottom:1px solid #f1e9da;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:#faf4ea}
.clickable{cursor:pointer}
.name-cell{font-weight:600;color:var(--ink)}
.name-cell .arrow{color:var(--gold-d);opacity:0;transition:.15s;margin-left:6px}
tr:hover .name-cell .arrow{opacity:1}

/* Controls */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=text],select{font-family:'Outfit';font-size:13.5px;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;outline:none;transition:.15s}
input[type=text]:focus,select:focus{border-color:var(--gold)}
input[type=text]{min-width:210px}
.chip{font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink-soft);transition:.15s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--pp-700);color:#fff;border-color:var(--pp-700)}

/* Register */
.reg-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow);max-height:72vh}
.reg{border-collapse:separate;border-spacing:0;font-size:12px}
.reg th,.reg td{padding:0;border-bottom:1px solid #f1e9da;border-right:1px solid #f5eee0}
.reg th{background:var(--bg-2);font-size:10px;padding:8px 6px;writing-mode:vertical-rl;transform:rotate(180deg);height:96px;white-space:nowrap}
.reg th.namehead,.reg td.namecol{writing-mode:initial;transform:none}
.reg .namecol{position:sticky;left:0;background:var(--paper);font-weight:600;padding:8px 12px;min-width:175px;z-index:1;border-right:1.5px solid var(--line)}
.reg th.namehead{position:sticky;left:0;z-index:3;writing-mode:initial;transform:none;text-align:left;padding:8px 12px;min-width:175px;height:auto}
.reg tbody tr:hover .namecol{background:#faf4ea}
.cellbtn{width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:13px;user-select:none}
.cellbtn.p{background:rgba(95,115,85,.18);color:var(--growing);font-weight:700}
.cellbtn.a{background:rgba(194,104,63,.12);color:var(--drifting)}
.cellbtn.n{color:#dcd2c2}
.cellbtn:hover{outline:2px solid var(--gold);outline-offset:-2px}
.reg th.future{opacity:.5}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(38,9,63,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:40px 18px;z-index:60;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--paper);border-radius:20px;max-width:700px;width:100%;box-shadow:0 30px 90px rgba(38,9,63,.4);animation:pop .25s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:26px 28px 20px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(155deg,#fffdfa,#f3ecf6)}
.modal-head .avatar{width:56px;height:56px;border-radius:15px;background:linear-gradient(150deg,var(--pp-600),var(--pp-800));color:var(--gold-l);display:grid;place-items:center;font-family:'Fraunces';font-size:24px;font-weight:600;margin-bottom:14px;box-shadow:0 8px 20px rgba(74,29,110,.3)}
.modal-head h2{font-size:27px}
.modal-close{position:absolute;top:20px;right:22px;font-size:20px;cursor:pointer;color:var(--ink-faint);width:34px;height:34px;display:grid;place-items:center;border-radius:9px}
.modal-close:hover{background:var(--bg-2);color:var(--ink)}
.modal-body{padding:24px 28px 30px}
.minigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.mini{background:var(--bg);border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.mini .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600}
.mini .v{font-family:'Fraunces';font-size:24px;font-weight:600;margin-top:5px}
.bioline{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #f1e9da;font-size:14px}
.bioline .l{color:var(--ink-faint)}.bioline .r{font-weight:600;text-align:right}
.status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.statusctl{font-family:'Outfit';font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer}
.btn{font-family:'Outfit';font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:10px;border:none;background:var(--pp-700);color:#fff;cursor:pointer;transition:.15s}
.btn:hover{background:var(--pp-800)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg-2)}
.spark{display:flex;gap:3px;align-items:flex-end;height:42px;margin-top:6px}
.spark i{flex:1;background:var(--growing);border-radius:2px 2px 0 0;min-height:3px;opacity:.85}
.spark i.absent{background:#e6d8c8}
.chartbox{position:relative;height:320px}.chartbox.sm{height:262px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.two,.three{grid-template-columns:1fr}}
.pill-list{display:flex;flex-direction:column;gap:9px}
.rankrow{display:flex;align-items:center;gap:12px}
.rankrow .nm{flex:none;width:160px;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankrow .bar{flex:1;height:22px;background:var(--bg-2);border-radius:6px;overflow:hidden}
.rankrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-l),var(--gold-d));border-radius:6px}
.rankrow .vv{flex:none;width:38px;text-align:right;font-weight:700;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg-2);color:var(--ink-soft)}
.tag.ret{background:rgba(95,115,85,.18);color:var(--growing)}
.tag.no{background:rgba(194,104,63,.16);color:var(--drifting)}
.tag.warn{background:rgba(203,154,47,.18);color:var(--gold-d)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.empty{text-align:center;padding:40px;color:var(--ink-faint)}
.namelist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.namechip{font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:8px;background:var(--bg);border:1px solid var(--line);cursor:pointer;transition:.14s}
.namechip:hover{border-color:var(--gold);background:#fff}
.namechip.show{border-left:3px solid var(--growing)}
.namechip.noshow{border-left:3px solid var(--drifting)}
.pastorcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pastorcard .pc-head{padding:18px 20px;background:linear-gradient(120deg,var(--pp-700),var(--pp-800));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pastorcard .pc-head h3{color:#fff}.pastorcard .pc-head .meta{font-size:12px;color:var(--gold-l)}
.pc-body{padding:18px 20px}
.split-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
.dot{width:9px;height:9px;border-radius:50%}
.dot.g{background:var(--growing)}.dot.r{background:var(--drifting)}
.amlab{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;margin-bottom:5px}
.modal-body input[type=text]{width:100%}
.hc-input{width:90px;font-family:'Outfit';font-size:14px;font-weight:600;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
.hc-input:focus{border-color:var(--gold)}
.dur-cell{width:46px;height:34px;border:none;background:transparent;text-align:center;font-family:'Outfit';font-size:12px;color:var(--ink);outline:none;-moz-appearance:textfield}
.dur-cell::-webkit-outer-spin-button,.dur-cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dur-cell:focus{outline:2px solid var(--gold);outline-offset:-2px}
</style>
<div class="shell">
  <aside class="sidebar">
    <div class="sb-brand">
      <img class="sb-logo" id="sbLogo" alt="Kadosh Royal Ecclesia">
      <div class="sb-name">Kadosh Royal<br>Ecclesia</div>
      <div class="sb-tag">Membership Intelligence</div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">
      Auto-saving · 2026
      <div class="saved" id="savedflag">Changes saved</div>
    </div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let overrides={status:{},marks:{}};
let charts={};

async function loadOverrides(){ try{const r=await window.storage.get('kre_overrides'); if(r&&r.value) overrides=JSON.parse(r.value);}catch(e){} }
let saveTimer=null;
async function persist(){
  try{await window.storage.set('kre_overrides',JSON.stringify(overrides));}catch(e){}
  const f=document.getElementById('savedflag');f.classList.add('show');
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>f.classList.remove('show'),1600);
}

/* ============================ HELPERS ============================ */
const fmtDate=iso=>{const d=new Date(iso+'T00:00');return d.getDate()+' '+MONTHS[d.getMonth()];};
const fmtFull=iso=>{const d=new Date(iso+'T00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};
const monthOf=iso=>MONTHS[new Date(iso+'T00:00').getMonth()];
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const nkey=n=>(n||'').toLowerCase().replace(/[^a-z]/g,'');
const esc=s=>s.replace(/'/g,"\\'");
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';

function memStatus(m){return overrides.status[m.name]||m.status||'Unclassified';}
function isWorker(m){return memStatus(m)==='Worker';}
function memMark(m,iso){const k=m.name+'|'+iso;if(k in overrides.marks)return overrides.marks[k];if(iso in (m.attendance||{}))return m.attendance[iso];return null;}
function servicesPresent(m){let c=0;DATA.data_dates.forEach(iso=>{if(memMark(m,iso)===1)c++;});return c;}
function attendanceRate(m){let p=0,t=0;DATA.data_dates.forEach(iso=>{const v=memMark(m,iso);if(v!==null){t++;if(v===1)p++;}});return t?p/t:0;}
function memDur(m,iso){const k=m.name+'|'+iso;if(overrides.duration&&(k in overrides.duration))return overrides.duration[k];return (m.duration&&(iso in m.duration))?m.duration[iso]:null;}
function durMap(m){const d=Object.assign({},m.duration||{});if(overrides.duration){const pre=m.name+'|';for(const k in overrides.duration){if(k.indexOf(pre)===0){const iso=k.slice(pre.length);const v=overrides.duration[k];if(v==null)delete d[iso];else d[iso]=v;}}}return d;}
function avgDuration(m){const v=Object.values(durMap(m)).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
function lastSeen(m){let last=null;DATA.data_dates.forEach(iso=>{if(memMark(m,iso)===1)last=iso;});return last;}
function totalServices(){return DATA.data_dates.length;}
function weeksSince(m){const ls=lastSeen(m);if(!ls)return 99;return DATA.data_dates.filter(d=>d>ls).length;}
function avgAllDuration(){let s=0,c=0;DATA.members.forEach(m=>{const a=avgDuration(m);if(a>0){s+=a;c++;}});return c?s/c:0;}
function ENGAGED(s){return ['Growing Member','Active Member','Worker','Covenant Member'].includes(s);}
function effGeneral(){const g=Object.assign({},DATA.general||{});const o=overrides.general||{};for(const k in o)g[k]=o[k];return g;}
function memGeneral(iso){const o=overrides.general||{};if(iso in o)return o[iso];return (iso in (DATA.general||{}))?DATA.general[iso]:null;}
function serviceList(iso){const o=overrides.service||{};if(iso in o)return o[iso];return (DATA.service&&DATA.service[iso])?DATA.service[iso].slice():[];}

/* ============================ NAV ============================ */
const NAV=[
  ['__grp','Insight'],
  ['overview','Dashboard','◆'],
  ['general','General Attendance','📈'],
  ['__grp','People'],
  ['members','Member Status','👤'],
  ['workers','Workers','⚜'],
  ['register','Attendance Register','🗓'],
  ['duration','Service Duration','⏱'],
  ['__grp','Growth & Care'],
  ['firsttimers','First Timers','✦'],
  ['pastors','Pastor Engagement','✚'],
  ['followup','Follow-Up','🔔'],
];
let active='overview';
function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(n=>{
    if(n[0]==='__grp') return `<div class="sb-sec">${n[1]}</div>`;
    return `<button class="navitem ${n[0]===active?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[2]}</span>${n[1]}</button>`;
  }).join('');
}
const TITLES={overview:['Insight','Dashboard'],general:['Insight','General Attendance'],members:['People','Member Status'],
  workers:['People','Workers'],register:['People','Attendance Register'],duration:['People','Service Duration'],firsttimers:['Growth & Care','First Timers'],
  pastors:['Growth & Care','Pastor Engagement'],followup:['Growth & Care','Follow-Up & Last Seen']};
function go(t){active=t;renderNav();Object.values(charts).forEach(c=>c&&c.destroy());charts={};renderView();window.scrollTo(0,0);}
function head(){const t=TITLES[active];return `<div class="pagehead"><div><div class="crumb">${t[0]}</div><h1>${t[1]}</h1></div></div>`;}
function renderView(){
  const v=document.getElementById('view');
  if(active==='overview'){v.innerHTML=head()+viewOverview();drawOverview();}
  else if(active==='general'){v.innerHTML=head()+viewGeneral();drawGeneral();}
  else if(active==='members'){v.innerHTML=head()+viewMembers();renderMemberTable();}
  else if(active==='workers'){v.innerHTML=head()+viewWorkers();drawWorkers();}
  else if(active==='register'){v.innerHTML=head()+viewRegister();renderRegister();}
  else if(active==='duration'){v.innerHTML=head()+viewDuration();drawDuration();renderDurationGrid();}
  else if(active==='firsttimers'){v.innerHTML=head()+viewFirstTimers();drawFirstTimers();}
  else if(active==='pastors'){v.innerHTML=head()+viewPastors();drawPastors();}
  else if(active==='followup'){v.innerHTML=head()+viewFollowup();}
}
</script>
<script>
/* ============================ DASHBOARD ============================ */
function viewOverview(){
  const mem=DATA.members, total=mem.length;
  const sc={}; mem.forEach(m=>{const s=memStatus(m);sc[s]=(sc[s]||0)+1;});
  const engaged=mem.filter(m=>ENGAGED(memStatus(m))).length;
  const gv=Object.values(effGeneral());
  const avgGen=gv.length?Math.round(gv.reduce((a,b)=>a+b,0)/gv.length):0;
  const ft=DATA.firsttimers, ftRet=ft.filter(didReturn).length;
  const workers=mem.filter(isWorker);
  const wRate=workers.length?Math.round(workers.reduce((a,m)=>a+attendanceRate(m),0)/workers.length*100):0;
  const atRisk=mem.filter(m=>weeksSince(m)>=4).length;
  // congregation attendance rate
  let p=0,t=0; mem.forEach(m=>DATA.data_dates.forEach(iso=>{const v=memMark(m,iso);if(v!==null){t++;if(v===1)p++;}}));
  const congRate=t?Math.round(p/t*100):0;
  // faithful leaders
  const faithful=mem.map(m=>({m,r:attendanceRate(m),sp:servicesPresent(m)})).filter(x=>x.sp>0).sort((a,b)=>b.r-a.r||b.sp-a.sp).slice(0,6);
  const maxSp=Math.max(1,...faithful.map(x=>x.sp));
  const faithBars=faithful.map(x=>`<div class="rankrow"><div class="nm clickable" onclick="openMember('${esc(x.m.name)}')">${x.m.name}</div><div class="bar"><i style="width:${x.sp/maxSp*100}%"></i></div><div class="vv">${Math.round(x.r*100)}%</div></div>`).join('');
  // inviter quick
  const inv={}; ft.forEach(f=>{if(f.invited_by)inv[f.invited_by]=(inv[f.invited_by]||0)+1;});
  const topInv=Object.entries(inv).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxInv=Math.max(1,...topInv.map(x=>x[1]));
  const invBars=topInv.map(([n,c])=>`<div class="rankrow"><div class="nm">${n}</div><div class="bar"><i style="width:${c/maxInv*100}%"></i></div><div class="vv">${c}</div></div>`).join('');

  const cards=[
    ['Total Members',total,'on the roll','👥','s-purple'],
    ['Avg. Sunday Attendance',avgGen,`${gv.length} services`,'📊','s-teal'],
    ['Congregation Attend. Rate',congRate+'%','members present when marked','✓','s-green'],
    ['Engaged Members',engaged,`${pct(engaged,total)} of roll`,'🔥','s-green'],
    ['First-Timer Retention',pct(ftRet,ft.length),`${ftRet} of ${ft.length} returned`,'✦','s-teal'],
    ['Worker Reliability',wRate+'%','avg worker attendance','⚜','s-purple'],
    ['Needs Follow-Up',atRisk,'not seen 4+ weeks','🔔','s-red'],
    ['Avg. Time in Service',Math.round(avgAllDuration())+'m','depth of engagement','⏱','s-teal'],
  ].map(c=>`<div class="card stat ${c[4]}"><span class="ic">${c[3]}</span><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="d">${c[2]}</div></div>`).join('');

  const statusBars=SIX_STATUSES.concat(['Unclassified']).map(s=>{const n=sc[s]||0;return n?`<div class="rankrow"><div class="nm"><span class="badge b-${STATUS_KEY[s]}">${s}</span></div><div class="bar"><i style="width:${n/total*100}%"></i></div><div class="vv">${n}</div></div>`:'';}).join('');

  return `
  <p class="section-intro">A living overview of Kadosh Royal Ecclesia — congregation momentum, membership health, discipleship engagement and the people who need care this week. Every figure updates as you mark attendance and reclassify members.</p>
  <div class="grid cards" style="margin-bottom:18px">${cards}</div>
  <div class="two" style="margin-bottom:16px">
    <div class="panel"><div class="ph"><div><h3>Attendance Momentum</h3><div class="muted">general Sunday headcount with running average</div></div></div><div class="chartbox"><canvas id="ovTrend"></canvas></div></div>
    <div class="panel"><div class="ph"><div><h3>Membership Composition</h3><div class="muted">who makes up the body</div></div></div><div class="chartbox"><canvas id="ovDonut"></canvas></div></div>
  </div>
  <div class="three">
    <div class="panel"><div class="ph"><div><h3>By Status</h3></div></div><div class="pill-list">${statusBars}</div></div>
    <div class="panel"><div class="ph"><div><h3>Most Faithful</h3><div class="muted">top attendance</div></div></div><div class="pill-list">${faithBars}</div></div>
    <div class="panel"><div class="ph"><div><h3>Top Inviters</h3><div class="muted">bringing first timers</div></div></div><div class="pill-list">${invBars||'<div class="muted">No inviter data yet</div>'}</div></div>
  </div>`;
}
function drawOverview(){
  const e=Object.keys(effGeneral()).sort();
  const labels=e.map(fmtDate), vals=e.map(k=>effGeneral()[k]);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  charts.ovt=new Chart(document.getElementById('ovTrend'),{type:'line',
    data:{labels,datasets:[
      {label:'Attendance',data:vals,borderColor:'#a47d1f',backgroundColor:goldGrad(),fill:true,tension:.35,borderWidth:2.5,pointRadius:3,pointBackgroundColor:'#a47d1f',pointBorderColor:'#fff',pointBorderWidth:2},
      {label:'Average',data:vals.map(()=>avg),borderColor:'#6b2c3e',borderDash:[6,5],borderWidth:1.5,pointRadius:0}
    ]},options:baseOpts(true)});
  const mem=DATA.members,sc={};mem.forEach(m=>{const s=memStatus(m);sc[s]=(sc[s]||0)+1;});
  const labs=SIX_STATUSES.concat(['Unclassified']).filter(s=>sc[s]);
  const cols={'Growing Member':'#5f7355','Active Member':'#2f8079','Worker':'#cb9a2f','Covenant Member':'#6b2c3e','Inactive Member':'#9a8d86','Drifting Member':'#c2683f','Unclassified':'#b3a99e'};
  charts.ovd=new Chart(document.getElementById('ovDonut'),{type:'doughnut',
    data:{labels:labs,datasets:[{data:labs.map(s=>sc[s]),backgroundColor:labs.map(s=>cols[s]),borderColor:'#fffdfa',borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{font:{family:'Outfit',size:12},color:'#5f5366',padding:10,boxWidth:10,usePointStyle:true}}}}});
}

/* ============================ GENERAL ATTENDANCE ============================ */
let genYear=2026, svcDate=null;
function viewGeneral(){
  const gmap=effGeneral();
  const entries=Object.keys(gmap).sort();
  const vals=entries.map(k=>gmap[k]);
  const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  const monthly={};entries.forEach(k=>{const mo=monthOf(k);(monthly[mo]=monthly[mo]||[]).push(gmap[k]);});
  const monthRows=Object.keys(monthly).map(mo=>{const a=monthly[mo];const av=Math.round(a.reduce((x,y)=>x+y,0)/a.length);return `<tr><td class="name-cell">${mo}</td><td>${a.length}</td><td>${av}</td><td>${Math.max(...a)}</td><td>${Math.min(...a)}</td></tr>`;}).join('');
  const trend=vals.length>1?vals[vals.length-1]-vals[0]:0;
  const years=[...new Set(DATA.sundays.map(s=>+s.slice(0,4)))].sort();
  const ychips=years.map(y=>`<button class="chip ${y===genYear?'on':''}" onclick="setGenYear(${y})">${y}</button>`).join('');
  const today=new Date();
  const recRows=DATA.sundays.filter(s=>+s.slice(0,4)===genYear).map(iso=>{
    const v=memGeneral(iso); const named=serviceList(iso).length; const fut=new Date(iso+'T00:00')>today;
    return `<tr><td class="name-cell">${fmtFull(iso)}${fut?' <span class="muted">(upcoming)</span>':''}</td>
      <td><input type="number" min="0" class="hc-input" value="${v==null?'':v}" placeholder="—" onchange="setGeneral('${iso}',this.value)"></td>
      <td>${named?`<span class="tag ret">${named} recorded</span>`:'<span class="muted">none yet</span>'}</td>
      <td><button class="chip" onclick="openService('${iso}')">Manage attendees →</button></td></tr>`;
  }).join('');
  return `
  <p class="section-intro">Headcount of everyone present at each Sunday meeting — the truest pulse of the house. Record totals for any Sunday of the year below, and use the attendee list to capture exactly who was in service (members, first timers, and everyone else).</p>
  <div class="grid cards" style="margin-bottom:18px">
    <div class="card stat s-teal"><div class="k">Services Recorded</div><div class="v">${vals.length}</div><div class="d">Sundays with a headcount</div></div>
    <div class="card stat s-green"><div class="k">Average Attendance</div><div class="v">${avg}</div><div class="d">people per service</div></div>
    <div class="card stat s-purple"><div class="k">Highest</div><div class="v">${vals.length?Math.max(...vals):0}</div><div class="d">peak Sunday</div></div>
    <div class="card stat s-red"><div class="k">Lowest</div><div class="v">${vals.length?Math.min(...vals):0}</div><div class="d">quietest Sunday</div></div>
    <div class="card stat ${trend>=0?'s-green':'s-red'}"><div class="k">Net Change</div><div class="v">${trend>=0?'+':''}${trend}</div><div class="d">first vs latest service</div></div>
  </div>
  <div class="panel" style="margin-bottom:16px"><div class="ph"><div><h3>Attendance Trend</h3><div class="muted">every recorded Sunday with the running average</div></div></div><div class="chartbox"><canvas id="genTrend"></canvas></div></div>
  <div class="two" style="margin-bottom:16px">
    <div class="panel"><div class="ph"><div><h3>Monthly Average</h3></div></div><div class="chartbox sm"><canvas id="genMonth"></canvas></div></div>
    <div class="panel"><div class="ph"><div><h3>Monthly Breakdown</h3></div></div><div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Month</th><th>Services</th><th>Average</th><th>High</th><th>Low</th></tr></thead><tbody>${monthRows}</tbody></table></div></div>
  </div>
  <div class="panel"><div class="ph"><div><h3>Record Attendance &amp; Service Roll</h3><div class="muted">enter the total for any Sunday, and tap “manage attendees” to capture who was present</div></div><span style="display:flex;gap:6px">${ychips}</span></div>
    <div class="tbl-wrap" style="box-shadow:none;max-height:60vh"><table><thead><tr><th>Sunday</th><th>Total present</th><th>Named attendees</th><th></th></tr></thead><tbody>${recRows}</tbody></table></div>
  </div>`;
}
function setGenYear(y){genYear=y;renderView();}
function setGeneral(iso,v){overrides.general=overrides.general||{};const n=v===''?null:Math.max(0,Math.round(+v||0));if(n==null)delete overrides.general[iso];else overrides.general[iso]=n;persist();if(typeof postGAS==='function')postGAS('general',{date:iso,value:n});Object.values(charts).forEach(c=>c&&c.destroy());charts={};renderView();}
function drawGeneral(){
  const gmap=effGeneral();const e=Object.keys(gmap).sort();const labels=e.map(fmtDate);const vals=e.map(k=>gmap[k]);
  if(!vals.length)return;const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  charts.gt=new Chart(document.getElementById('genTrend'),{type:'line',data:{labels,datasets:[
    {label:'Attendance',data:vals,borderColor:'#a47d1f',backgroundColor:goldGrad(),fill:true,tension:.35,borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#a47d1f',pointBorderColor:'#fff',pointBorderWidth:2},
    {label:'Average',data:vals.map(()=>avg),borderColor:'#6b2c3e',borderDash:[6,5],borderWidth:1.5,pointRadius:0}]},options:baseOpts(true)});
  const monthly={};e.forEach(k=>{const mo=monthOf(k);(monthly[mo]=monthly[mo]||[]).push(gmap[k]);});
  const ml=Object.keys(monthly),mv=ml.map(mo=>Math.round(monthly[mo].reduce((a,b)=>a+b,0)/monthly[mo].length));
  charts.gm=new Chart(document.getElementById('genMonth'),{type:'bar',data:{labels:ml,datasets:[{data:mv,backgroundColor:'#5e2a87',borderRadius:8,maxBarThickness:48}]},options:baseOpts(false)});
}
function openService(iso){
  svcDate=iso;const list=serviceList(iso);
  const chips=list.length?list.map((n,i)=>`<span class="namechip" style="border-left:3px solid var(--active)">${String(n).replace(/</g,'&lt;')} <b style="color:var(--drifting);cursor:pointer;margin-left:4px" onclick="removeAttendee(${i})">✕</b></span>`).join(''):'<div class="muted">No one recorded yet for this service.</div>';
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><div class="modal-close" onclick="closeModal()">✕</div><div class="avatar">${list.length}</div><h2>Service Attendance</h2>
      <div class="muted" style="margin-top:6px">${fmtFull(iso)} — everyone who was in service</div></div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;margin-bottom:16px"><input type="text" id="svcName" placeholder="Add a name…" style="flex:1" onkeydown="if(event.key==='Enter')addAttendee()"><button class="btn" onclick="addAttendee()">Add</button></div>
      <div class="namelist" id="svcList">${chips}</div>
      <div class="status-row" style="margin-top:20px"><button class="btn ghost" onclick="useCountAsHeadcount('${iso}')">Set total present = ${list.length}</button><button class="btn ghost" onclick="closeModal()">Done</button></div>
      <div class="muted" style="margin-top:12px">This list captures <i>everyone</i> present — not just members or first timers.</div>
    </div>`;
  document.getElementById('modalbg').classList.add('show');
  setTimeout(()=>{const n=document.getElementById('svcName');if(n)n.focus();},50);
}
function saveService(){const iso=svcDate;persist();if(typeof postGAS==='function')postGAS('service',{date:iso,names:serviceList(iso)});}
function addAttendee(){const e=document.getElementById('svcName');const nm=(e.value||'').trim();if(!nm)return;const list=serviceList(svcDate);list.push(nm);overrides.service=overrides.service||{};overrides.service[svcDate]=list;saveService();openService(svcDate);}
function removeAttendee(i){const list=serviceList(svcDate);list.splice(i,1);overrides.service=overrides.service||{};overrides.service[svcDate]=list;saveService();openService(svcDate);}
function useCountAsHeadcount(iso){setGeneral(iso,serviceList(iso).length);closeModal();}
</script>
<script>
/* ============================ MEMBERS ============================ */
let memFilter='',memSearch='';
function viewMembers(){
  const chips=['All'].concat(SIX_STATUSES).map(f=>`<button class="chip ${(memFilter===f||(!memFilter&&f==='All'))?'on':''}" onclick="setMemFilter('${f}')">${f}</button>`).join('');
  return `
  <p class="section-intro">Every member with their live classification. Use the status control inside any profile to re-classify someone as their season changes — it saves automatically. Click a name to open the full profile: services attended, time in service, bio, assigned pastor and last attendance.</p>
  <div class="toolbar"><input type="text" id="memSearchBox" placeholder="Search a member…" value="${memSearch}" oninput="memSearch=this.value;renderMemberTable()">${chips}<button class="btn" style="margin-left:auto" onclick="openAddMember()">+ Add Member</button></div>
  <div id="memTableHost"></div>`;
}
function setMemFilter(f){memFilter=f==='All'?'':f;renderView();}
function renderMemberTable(){const h=document.getElementById('memTableHost');if(h)h.innerHTML=memberTableHTML();}
function memberTableHTML(){
  let rows=DATA.members.filter(m=>{const st=memStatus(m);if(memFilter&&st!==memFilter)return false;if(memSearch&&!m.name.toLowerCase().includes(memSearch.toLowerCase()))return false;return true;});
  rows.sort((a,b)=>a.name.localeCompare(b.name));
  if(!rows.length)return `<div class="panel"><div class="empty">No members match this filter.</div></div>`;
  const body=rows.map(m=>{const st=memStatus(m),sp=servicesPresent(m),ls=lastSeen(m);
    return `<tr class="clickable" onclick="openMember('${esc(m.name)}')"><td class="name-cell">${m.name}<span class="arrow">→</span></td><td><span class="badge b-${STATUS_KEY[st]}">${st}</span></td><td>${m.pastor||'<span class="muted">—</span>'}</td><td>${m.location||'<span class="muted">—</span>'}</td><td>${sp}/${totalServices()}</td><td>${Math.round(attendanceRate(m)*100)}%</td><td>${ls?fmtFull(ls):'<span class="muted">not yet</span>'}</td></tr>`;}).join('');
  return `<div class="tbl-wrap"><table><thead><tr><th>Member</th><th>Status</th><th>Pastor</th><th>Location</th><th>Services</th><th>Rate</th><th>Last Seen</th></tr></thead><tbody>${body}</tbody></table></div><div class="muted" style="margin-top:10px">${rows.length} member${rows.length>1?'s':''} shown</div>`;
}

/* ============================ WORKERS (standalone) ============================ */
let wkSearch='';
function workersList(){return DATA.members.filter(isWorker);}
function viewWorkers(){
  const w=workersList();
  const avgRate=w.length?Math.round(w.reduce((a,m)=>a+attendanceRate(m),0)/w.length*100):0;
  const showing=w.filter(m=>weeksSince(m)<3).length;
  const atRisk=w.filter(m=>weeksSince(m)>=3);
  const durs=w.map(avgDuration).filter(d=>d>0);
  const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):0;
  const perfect=w.filter(m=>attendanceRate(m)>=0.95 && servicesPresent(m)>0).length;
  const rows=w.slice().sort((a,b)=>attendanceRate(b)-attendanceRate(a)).map(m=>{
    const r=attendanceRate(m),ls=lastSeen(m),ws=weeksSince(m);

/* ============================ SERVICE DURATION ============================ */
let durSearch='', durYear=2026;
function serviceDurStats(){
  // per service (data_date): avg & total minutes among those with duration>0
  const per={};
  DATA.data_dates.forEach(iso=>{
    let s=0,c=0;
    DATA.members.forEach(m=>{const v=memDur(m,iso);if(v&&v>0){s+=v;c++;}});
    per[iso]={avg:c?s/c:0,total:s,count:c};
  });
  return per;
}
function viewDuration(){
  const per=serviceDurStats();
  const dates=DATA.data_dates;
  const avgs=dates.map(d=>per[d].avg).filter(x=>x>0);
  const overallAvg=avgs.length?Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length):0;
  let totalMin=0,longest=0;
  DATA.members.forEach(m=>{const dm=durMap(m);Object.values(dm).forEach(v=>{if(v>0){totalMin+=v;if(v>longest)longest=v;}});});
  const memAvgs=DATA.members.map(m=>({m,a:avgDuration(m)})).filter(x=>x.a>0).sort((a,b)=>b.a-a.a);
  const longestStayers=memAvgs.slice(0,8);
  const maxA=longestStayers.length?longestStayers[0].a:1;
  const ranks=longestStayers.map(x=>`<div class="rankrow"><div class="nm clickable" onclick="openMember('${esc(x.m.name)}')">${x.m.name}</div><div class="bar"><i style="width:${x.a/maxA*100}%"></i></div><div class="vv">${Math.round(x.a)}m</div></div>`).join('');
  const years=[...new Set(DATA.sundays.map(s=>+s.slice(0,4)))].sort();
  const ychips=years.map(y=>`<button class="chip ${y===durYear?'on':''}" onclick="setDurYear(${y})">${y}</button>`).join('');
  return `
  <p class="section-intro">How long each member actually stays in service, Sunday by Sunday — a measure of engagement depth beyond simply showing up. Enter or correct any member's minutes in the grid below (it saves automatically), and read the trends in the analysis above.</p>
  <div class="grid cards" style="margin-bottom:18px">
    <div class="card stat s-teal"><span class="ic">⏱</span><div class="k">Avg. Time in Service</div><div class="v">${overallAvg}<span style="font-size:14px;color:var(--ink-faint)">min</span></div><div class="d">per attending member</div></div>
    <div class="card stat s-purple"><div class="k">Longest Single Stay</div><div class="v">${Math.round(longest)}<span style="font-size:14px;color:var(--ink-faint)">min</span></div><div class="d">recorded this year</div></div>
    <div class="card stat s-green"><div class="k">Total Time Given</div><div class="v">${Math.round(totalMin/60)}<span style="font-size:14px;color:var(--ink-faint)">hrs</span></div><div class="d">all members combined</div></div>
    <div class="card stat s-teal"><div class="k">Weeks Tracked</div><div class="v">${avgs.length}</div><div class="d">services with duration data</div></div>
  </div>
  <div class="two" style="margin-bottom:16px">
    <div class="panel"><div class="ph"><div><h3>Average Duration per Service</h3><div class="muted">how long services run, week by week (minutes)</div></div></div><div class="chartbox"><canvas id="durTrend"></canvas></div></div>
    <div class="panel"><div class="ph"><div><h3>Longest-Staying Members</h3><div class="muted">by average minutes in service</div></div></div><div class="pill-list">${ranks||'<div class="muted">No duration data yet</div>'}</div></div>
  </div>
  <div class="panel"><div class="ph"><div><h3>Duration Register</h3><div class="muted">minutes each member stayed, per Sunday — tap a cell to edit</div></div><span style="display:flex;gap:6px;align-items:center"><input type="text" placeholder="Find a member…" value="${durSearch}" oninput="durSearch=this.value;renderDurationGrid()" style="min-width:160px">${ychips}</span></div>
    <div id="durHost"></div>
  </div>`;
}
function setDurYear(y){durYear=y;renderDurationGrid();}
function drawDuration(){
  const per=serviceDurStats();const labels=DATA.data_dates.map(fmtDate);const vals=DATA.data_dates.map(d=>Math.round(per[d].avg));
  if(!vals.some(v=>v>0))return;
  charts.dt=new Chart(document.getElementById('durTrend'),{type:'line',data:{labels,datasets:[{label:'Avg minutes',data:vals,borderColor:'#2f8079',backgroundColor:(ctx)=>{const c=ctx.chart.ctx;const g=c.createLinearGradient(0,0,0,300);g.addColorStop(0,'rgba(47,128,121,.28)');g.addColorStop(1,'rgba(47,128,121,0)');return g;},fill:true,tension:.35,borderWidth:2.5,pointRadius:3,pointBackgroundColor:'#2f8079',pointBorderColor:'#fff',pointBorderWidth:2}]},options:baseOpts(false)});
}
function durColor(v){ if(v==null||v==='')return ''; const t=Math.max(0,Math.min(1,v/120)); const a=(0.10+t*0.5).toFixed(2); return `background:rgba(47,128,121,${a});color:${t>0.55?'#fff':'var(--ink)'};font-weight:600`; }
function renderDurationGrid(){const h=document.getElementById('durHost');if(h)h.innerHTML=durationGridHTML();}
function durationGridHTML(){
  let mem=DATA.members.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(durSearch)mem=mem.filter(m=>m.name.toLowerCase().includes(durSearch.toLowerCase()));
  const days=DATA.sundays.filter(s=>+s.slice(0,4)===durYear);
  const today=new Date();
  const heads=days.map(iso=>`<th class="${new Date(iso+'T00:00')>today?'future':''}">${fmtDate(iso)}</th>`).join('');
  const body=mem.map(m=>{
    const cells=days.map(iso=>{const v=memDur(m,iso);return `<td><input type="number" min="0" class="dur-cell" style="${durColor(v)}" value="${v==null?'':v}" onchange="setDuration('${esc(m.name)}','${iso}',this.value)"></td>`;}).join('');
    return `<tr><td class="namecol clickable" onclick="openMember('${esc(m.name)}')">${m.name} <span style="color:var(--gold-d)">→</span></td>${cells}</tr>`;
  }).join('');
  return `<div class="reg-wrap"><table class="reg"><thead><tr><th class="namehead">Member</th>${heads}</tr></thead><tbody>${body}</tbody></table></div>`;

function setDuration(name,iso,v){const m=DATA.members.find(x=>x.name===name);if(!m)return;overrides.duration=overrides.duration||{};const n=v===''?null:Math.max(0,Math.round(+v||0));overrides.duration[name+'|'+iso]=n;persist();if(typeof postGAS==='function')postGAS('duration',{name:name,date:iso,value:n});Object.values(charts).forEach(c=>c&&c.destroy());charts={};renderView();}
</script>
<script>
/* ============================ PASTOR ENGAGEMENT ============================ */
function pastorGroups(){const g={};DATA.members.forEach(m=>{if(!m.pastor)return;(g[m.pastor]=g[m.pastor]||[]).push(m);});return g;}

        <div style="text-align:right"><div style="font-family:Fraunces;font-size:30px;font-weight:600;color:var(--gold-l)">${showing.length}/${list.length}</div><div class="meta">showing up</div></div></div>
      <div class="pc-body">
        <div class="minigrid" style="margin-bottom:6px">
          <div class="mini"><div class="k">Avg Attend Rate</div><div class="v">${avgRate}%</div></div>
          <div class="mini"><div class="k">Avg Time in Service</div><div class="v">${avgDur}<span style="font-size:13px">m</span></div></div>

        <div class="split-head"><span class="dot g"></span> Showing up (${showing.length})</div>

}

/* ============================ FIRST TIMERS ============================ */
function didReturn(f){
  if(f.weeks.length>1)return true;
  const m=DATA.members.find(x=>nkey(x.name)===nkey(f.name));
  if(m){const first=f.weeks[0];let after=false;DATA.data_dates.forEach(iso=>{if(memMark(m,iso)===1&&(!first||iso>first))after=true;});if(after)return true;}
  return false;
}
function viewFirstTimers(){
  const ft=DATA.firsttimers;const ret=ft.filter(didReturn),never=ft.filter(f=>!didReturn(f));
  const inv={};ft.forEach(f=>{const k=f.invited_by||'Unknown / not recorded';inv[k]=(inv[k]||0)+1;});
  const invSorted=Object.entries(inv).sort((a,b)=>b[1]-a[1]);
  const known=invSorted.filter(x=>x[0]!=='Unknown / not recorded');
  const maxInv=Math.max(1,...invSorted.map(x=>x[1]));
  const invBars=invSorted.map(([n,c])=>`<div class="rankrow"><div class="nm">${n}</div><div class="bar"><i style="width:${c/maxInv*100}%"></i></div><div class="vv">${c}</div></div>`).join('');
  const monthly={};ft.forEach(f=>{if(f.weeks[0]){const mo=monthOf(f.weeks[0]);monthly[mo]=(monthly[mo]||0)+1;}});
  const rows=ft.slice().sort((a,b)=>(a.weeks[0]||'9').localeCompare(b.weeks[0]||'9')).map(f=>{const r=didReturn(f);return `<tr class="clickable" onclick="openEditFirstTimer('${esc(f.name)}','${f.weeks[0]||''}')"><td class="name-cell">${f.name}<span class="arrow">✎</span></td><td>${f.invited_by||'<span class="muted">—</span>'}</td><td>${f.weeks[0]?fmtFull(f.weeks[0]):'<span class="muted">—</span>'}</td><td>${f.weeks.length}</td><td>${r?'<span class="tag ret">Returned</span>':'<span class="tag no">Not yet</span>'}</td></tr>`;}).join('');
  return `
  <p class="section-intro">Tracking visitors from their first Sunday onward — when they came, who invited them, and whether they came back. The retention split shows how well we convert first timers into regulars; the leaderboard shows who is bringing the most people through the doors.</p>
  <div class="toolbar"><button class="btn" onclick="openAddFirstTimer()">+ Add First Timer</button></div>
  <div class="grid cards" style="margin-bottom:18px">
    <div class="card stat s-purple"><span class="ic">✦</span><div class="k">Total First Timers</div><div class="v">${ft.length}</div><div class="d">recorded this year</div></div>
    <div class="card stat s-green"><div class="k">Returned</div><div class="v">${ret.length}</div><div class="d">${pct(ret.length,ft.length)} retention</div></div>
    <div class="card stat s-red"><div class="k">Never Returned</div><div class="v">${never.length}</div><div class="d">one-time visits</div></div>
    <div class="card stat s-teal"><div class="k">Active Inviters</div><div class="v">${known.length}</div><div class="d">people bringing guests</div></div>
  </div>
  <div class="two">
    <div class="panel"><div class="ph"><div><h3>Who's Inviting?</h3><div class="muted">first timers credited to each inviter</div></div></div><div class="pill-list">${invBars}</div>${known.length?`<div class="muted" style="margin-top:14px">🏆 Highest: <b>${known[0][0]}</b> (${known[0][1]}) · Lowest: <b>${known[known.length-1][0]}</b> (${known[known.length-1][1]})</div>`:''}</div>
    <div class="panel"><div class="ph"><div><h3>Retention</h3><div class="muted">did they come back?</div></div></div><div class="chartbox sm"><canvas id="ftPie"></canvas></div>
      <div class="ph" style="margin:18px 0 6px"><div><h4 style="font-size:15px">Monthly Inflow</h4></div></div><div class="chartbox sm" style="height:170px"><canvas id="ftMonth"></canvas></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="ph"><div><h3>First Timer Log</h3></div></div><div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Name</th><th>Invited By</th><th>First Visit</th><th>Times Seen</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function drawFirstTimers(){
  const ft=DATA.firsttimers;const r=ft.filter(didReturn).length,n=ft.length-r;
  charts.ft=new Chart(document.getElementById('ftPie'),{type:'doughnut',data:{labels:['Returned','Never returned'],datasets:[{data:[r,n],backgroundColor:['#5f7355','#c2683f'],borderColor:'#fffdfa',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'bottom',labels:{font:{family:'Outfit',size:13},color:'#5f5366',padding:14,usePointStyle:true}}}}});
  const monthly={};ft.forEach(f=>{if(f.weeks[0]){const mo=monthOf(f.weeks[0]);monthly[mo]=(monthly[mo]||0)+1;}});
  const ml=MONTHS.filter(m=>monthly[m]);
  charts.ftm=new Chart(document.getElementById('ftMonth'),{type:'bar',data:{labels:ml,datasets:[{data:ml.map(m=>monthly[m]),backgroundColor:'#cb9a2f',borderRadius:6,maxBarThickness:40}]},options:baseOpts(false)});
}

/* ============================ FOLLOW-UP ============================ */
function viewFollowup(){
  const mem=DATA.members.map(m=>({m,ls:lastSeen(m),ws:weeksSince(m),sp:servicesPresent(m)}));
  mem.sort((a,b)=>b.ws-a.ws);
  const rows=mem.map(({m,ls,ws,sp})=>{let flag,cls;if(sp===0){flag='Never seen';cls='no';}else if(ws>=6){flag=ws+' wks ago';cls='no';}else if(ws>=3){flag=ws+' wks ago';cls='warn';}else{flag='Recent';cls='ret';}
    return `<tr class="clickable" onclick="openMember('${esc(m.name)}')"><td class="name-cell">${m.name}<span class="arrow">→</span></td><td><span class="badge b-${STATUS_KEY[memStatus(m)]}">${memStatus(m)}</span></td><td>${m.pastor||'<span class="muted">—</span>'}</td><td>${ls?fmtFull(ls):'<span class="muted">not yet</span>'}</td><td><span class="tag ${cls}">${flag}</span></td></tr>`;}).join('');
  const need=mem.filter(x=>x.ws>=4).length;
  return `
  <p class="section-intro">A follow-up priority list — every member ranked by how long since they were last in service. The people at the top are the ones to call, visit, or check on this week.</p>

    <div class="card stat s-green"><div class="k">Seen Recently</div><div class="v">${mem.filter(x=>x.ws<3&&x.sp>0).length}</div><div class="d">within last 2 weeks</div></div>
    <div class="card stat s-purple"><div class="k">Never Recorded</div><div class="v">${mem.filter(x=>x.sp===0).length}</div><div class="d">no attendance yet</div></div>
  </div>
  <div class="panel"><div class="ph"><div><h3>Last Seen — Follow-Up Priority</h3><div class="muted">most overdue first · click a name for the full profile</div></div></div><div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Member</th><th>Status</th><th>Pastor</th><th>Last Seen</th><th>Flag</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ============================ MEMBER MODAL ============================ */
function engagementLabel(m){
  const sp=servicesPresent(m); if(sp===0) return ['Not yet seen','b-Unclassified'];
  const ws=weeksSince(m), rate=attendanceRate(m);
  if(ws>=4) return ['Drifting — follow up','b-Drifting'];
  if(rate>=0.8) return ['Highly engaged','b-Growing'];
  if(rate>=0.5) return ['Engaged','b-Active'];
  return ['Occasional','b-Worker'];
}
function openMember(name){
  const m=DATA.members.find(x=>x.name===name);if(!m)return;
  const st=memStatus(m),sp=servicesPresent(m),rate=attendanceRate(m),ad=avgDuration(m),ls=lastSeen(m);
  const _dm=durMap(m);const totalDur=Object.values(_dm).reduce((a,b)=>a+b,0);
  const durWeeks=Object.keys(_dm).length;
  const longest=Object.values(_dm).reduce((a,b)=>Math.max(a,b),0);
  const el=engagementLabel(m);
  const opts=SIX_STATUSES.concat(st==='Unclassified'?['Unclassified']:[]);
  const sel=`<select class="statusctl" id="statusSel">${opts.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select>`;
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><div class="modal-close" onclick="closeModal()">✕</div><div class="avatar">${initials(m.name)}</div><h2>${m.name}</h2>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><span class="badge b-${STATUS_KEY[st]}">${st}</span> ${isWorker(m)?'<span class="badge b-Worker">⚜ Worker</span>':''} <span class="badge ${el[1]}">${el[0]}</span></div></div>
    <div class="modal-body">
      <div class="minigrid">
        <div class="mini"><div class="k">Services Present</div><div class="v">${sp}<span style="font-size:13px;color:var(--ink-faint)">/${totalServices()}</span></div></div>
        <div class="mini"><div class="k">Attendance Rate</div><div class="v">${Math.round(rate*100)}<span style="font-size:14px">%</span></div></div>
        <div class="mini"><div class="k">Avg. Time in Service</div><div class="v">${Math.round(ad)}<span style="font-size:13px;color:var(--ink-faint)">min</span></div></div>
        <div class="mini"><div class="k">Longest Stay</div><div class="v">${Math.round(longest)}<span style="font-size:13px;color:var(--ink-faint)">min</span></div></div>
      </div>
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600;margin-bottom:4px">Engagement — minutes in service by Sunday</div>
      <div style="position:relative;height:170px;margin-bottom:6px"><canvas id="memChart"></canvas></div>
      <div class="muted" style="margin-bottom:6px">Total time given: <b>${Math.round(totalDur)} min</b> (${(totalDur/60).toFixed(1)} hrs) over ${durWeeks} recorded service${durWeeks===1?'':'s'}.</div>
      <div style="margin:16px 0 4px">
        <div class="bioline"><span class="l">Assigned Pastor</span><span class="r">${m.pastor||'—'}</span></div>
        <div class="bioline"><span class="l">Phone</span><span class="r">${m.phone||'—'}</span></div>
        <div class="bioline"><span class="l">Location</span><span class="r">${m.location||'—'}</span></div>
        <div class="bioline"><span class="l">Last Attendance</span><span class="r">${ls?fmtFull(ls):'Not yet recorded'}</span></div>
      </div>
      <div class="status-row"><span style="font-weight:600;font-size:14px">Change status:</span>${sel}<button class="btn" onclick="saveStatus('${esc(m.name)}')">Update</button><button class="btn ghost" onclick="openEditMember('${esc(m.name)}')">✎ Edit details</button><button class="btn ghost" onclick="closeModal()">Close</button></div>
    </div>`;
  document.getElementById('modalbg').classList.add('show');
  drawMemberChart(m);
}
function drawMemberChart(m){
  const cv=document.getElementById('memChart');if(!cv||typeof Chart==='undefined')return;
  if(charts.mem){charts.mem.destroy();charts.mem=null;}
  const dates=DATA.data_dates;const _dm=durMap(m);
  const mins=dates.map(iso=>{const v=memDur(m,iso);return (v&&v>0)?v:0;});
  const present=dates.map(iso=>memMark(m,iso)===1);
  charts.mem=new Chart(cv,{type:'bar',data:{labels:dates.map(fmtDate),datasets:[{label:'Minutes',data:mins,
    backgroundColor:mins.map((v,i)=>v>0?'#2f8079':(present[i]?'rgba(95,115,85,.45)':'rgba(194,104,63,.25)')),borderRadius:4,maxBarThickness:18}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const i=c.dataIndex;return c.parsed.y>0?c.parsed.y+' min':(present[i]?'present (no duration logged)':'absent');}}}},
      scales:{x:{grid:{display:false},ticks:{font:{family:'Outfit',size:9},color:'#928697',maxRotation:60,minRotation:60}},
        y:{beginAtZero:true,grid:{color:'#efe7d8'},ticks:{font:{family:'Outfit',size:10},color:'#928697'}}}}});
}
function saveStatus(name){const sel=document.getElementById('statusSel');if(!sel)return;const st=sel.value;overrides.status[name]=st;persist();postGAS('status',{name:name,status:st});openMember(name);if(active==='members')renderMemberTable();else renderView();}
function closeModal(){if(charts.mem){charts.mem.destroy();charts.mem=null;}document.getElementById('modalbg').classList.remove('show');}

  const popt=pastors.map(p=>`<option ${p===m.pastor?'selected':''}>${p}</option>`).join('');
  document.getElementById('modal').innerHTML=`

      <div class="muted" style="margin-top:6px">Correct the name, phone, location or pastor</div></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div style="grid-column:1/-1"><label class="amlab">Full name *</label><input type="text" id="emName" value="${(m.name||'').replace(/"/g,'&quot;')}"></div>

        <div><label class="amlab">Status</label><select id="emStatus" class="statusctl" style="width:100%">${SIX_STATUSES.concat(memStatus(m)==='Unclassified'?['Unclassified']:[]).map(s=>`<option ${s===memStatus(m)?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label class="amlab">Assigned Pastor</label><select id="emPastor" class="statusctl" style="width:100%"><option value="">— none —</option>${popt}</select></div>
      </div>
      <div id="emErr" style="color:var(--drifting);font-size:13px;margin-top:12px;display:none"></div>
      <div class="status-row" style="margin-top:20px"><button class="btn" onclick="saveEditMember('${esc(name)}')">Save changes</button><button class="btn ghost" onclick="openMember('${esc(name)}')">Cancel</button></div>
    </div>`;
  document.getElementById('modalbg').classList.add('show');
}
function saveEditMember(origName){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const m=DATA.members.find(x=>x.name===origName);if(!m)return;
  const err=document.getElementById('emErr');
  const newName=g('emName');
  if(!newName){err.textContent='Name cannot be empty.';err.style.display='block';return;}
  if(newName!==origName && DATA.members.find(x=>nkey(x.name)===nkey(newName))){err.textContent='Another member already has that name.';err.style.display='block';return;}
  const newStatus=g('emStatus')||memStatus(m);
  if(newName!==origName){
    // migrate name-keyed overrides
    if(overrides.status[origName]!==undefined){overrides.status[newName]=overrides.status[origName];delete overrides.status[origName];}
    Object.keys(overrides.marks).forEach(k=>{if(k.indexOf(origName+'|')===0){overrides.marks[newName+k.slice(origName.length)]=overrides.marks[k];delete overrides.marks[k];}});
  }
  m.name=newName;m.phone=g('emPhone')||null;m.location=g('emLoc')||null;m.pastor=g('emPastor')||null;m.status=newStatus;
  overrides.status[newName]=newStatus;
  overrides.profileEdits=overrides.profileEdits||[];
  overrides.profileEdits.push({from:origName,set:{name:newName,phone:m.phone,location:m.location,pastor:m.pastor,status:newStatus}});
  persist();
  if(typeof postGAS==='function')postGAS('editMember',{original:origName,name:newName,phone:m.phone,location:m.location,pastor:m.pastor,status:newStatus});
  openMember(newName);
}
